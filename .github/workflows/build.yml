name: Build AdSkip

on:
  workflow_dispatch:
  push:
    branches:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${github.ref}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rootless
            type: rootless
            theos: https://github.com/theos/theos.git
            scheme: rootless
            target: iphone:clang:16.5:15.0
            artifact: AdSkip-rootless

          - name: RootHide
            type: roothide
            theos: https://github.com/roothide/theos.git
            scheme: roothide
            target: iphone:clang:16.5:15.0
            artifact: AdSkip-roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/theos"

          git clone \
            --depth 1 \
            --recursive \
            "${{ matrix.theos }}" \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install ldid
        shell: bash
        run: |
          set -e

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

      - name: Install SDK
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/theos-sdks"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$HOME/theos-sdks"

          SDK="$HOME/theos-sdks/iPhoneOS16.5.sdk"

          if [ ! -d "$SDK" ]; then
            echo "iPhoneOS16.5.sdk not found"
            find "$HOME/theos-sdks" -maxdepth 1 -name "*.sdk" -print
            exit 1
          fi

          rm -rf "$THEOS/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$SDK" "$THEOS/sdks/"

      - name: Build package
        shell: bash
        run: |
          set -e

          make clean

          make package \
            TARGET="${{ matrix.target }}" \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            FINALPACKAGE=1

      - name: Rename package
        shell: bash
        run: |
          set -e

          mkdir -p output

          for package in packages/*.deb; do
            [ -f "$package" ] || continue

            name="$(basename "$package" .deb)"
            cp "$package" "output/${name}-${{ matrix.type }}.deb"
          done

          test -n "$(find output -name '*.deb' -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/*.deb
          if-no-files-found: error
          retention-days: 14
