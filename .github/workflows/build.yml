name: Build AdSkip

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        scheme:
          - rootless
          - roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build package
        env:
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
        run: |
          make clean package FINALPACKAGE=1

      - name: Rename package
        run: |
          mkdir -p output/${{ matrix.scheme }}

          for deb in packages/*.deb; do
            [ -f "$deb" ] || continue

            filename="$(basename "$deb" .deb)"
            cp "$deb" "output/${{ matrix.scheme }}/${filename}-${{ matrix.scheme }}.deb"
          done

          test -n "$(find output/${{ matrix.scheme }} -name '*.deb' -print -quit)"

      - name: Upload ${{ matrix.scheme }} package
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-${{ matrix.scheme }}
          path: output/${{ matrix.scheme }}/*.deb
          if-no-files-found: error
          retention-days: 14
